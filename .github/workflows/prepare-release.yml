name: Prepare Release

on:
  push:
    branches:
      - main
    paths:
      - "mainnet/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: Open Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run generation script
        run: uv run python scripts/generate_token_list_file.py

      - name: Check for token list changes
        id: changes
        run: |
          if git diff --quiet tokenlist-mainnet.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync npm/token-list/package.json version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          node npm/token-list/scripts/codegen.mjs
          echo "value=$(node -p "require('./npm/token-list/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Write PR body
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          echo "Automated publishing PR: updates \`tokenlist-mainnet.json\` to v${VERSION} and bumps \`npm/token-list/package.json\`." > pr-body.md

      - name: Create signed commit and open publishing PR
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/open-signed-pr
        with:
          branch: publish/v${{ steps.version.outputs.value }}
          commit-message: Update token list to v${{ steps.version.outputs.value }}
          title: Publish token list v${{ steps.version.outputs.value }}
          body-file: pr-body.md
          files: |
            tokenlist-mainnet.json
            npm/token-list/package.json
