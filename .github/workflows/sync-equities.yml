name: Sync Equities

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      max_removals:
        description: "Abort if more tokens than this disappear in one sync (blank: script default)"
        required: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: Open Equities Sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # When one issuer fails, the script still writes the other issuers' updates and
      # exits 1. Continue so the PR is opened, then fail the run at the end.
      - name: Run sync script
        id: sync
        continue-on-error: true
        env:
          MAX_REMOVALS: ${{ inputs.max_removals }}
        run: |
          set -o pipefail
          uv run python scripts/sync_equities.py ${MAX_REMOVALS:+--max-removals "$MAX_REMOVALS"} | tee sync-output.txt

      - name: Check for token list changes
        id: changes
        run: |
          if git diff --quiet tokenlist-equities.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync npm/equities/package.json version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          node npm/equities/scripts/codegen.mjs
          echo "value=$(node -p "require('./npm/equities/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Write PR body
        if: steps.changes.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo "Automated sync from tokenized equity issuers: updates \`tokenlist-equities.json\` to v${VERSION} and bumps \`npm/equities/package.json\`. Merging publishes \`@monad-crypto/equities-token-list\`."
            echo
            echo '```'
            cat sync-output.txt
            echo '```'
          } > pr-body.md

      # A single long-lived branch, so there is at most one open sync PR and it
      # always reflects the latest issuer state.
      - name: Create signed commit and open sync PR
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/open-signed-pr
        with:
          branch: sync/equities
          commit-message: Sync equities token list to v${{ steps.version.outputs.value }}
          title: Sync equities token list to v${{ steps.version.outputs.value }}
          body-file: pr-body.md
          files: |
            tokenlist-equities.json
            npm/equities/package.json

      - name: Fail if any issuer failed to sync
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Equities sync failed for at least one issuer; see the sync script output."
          exit 1
